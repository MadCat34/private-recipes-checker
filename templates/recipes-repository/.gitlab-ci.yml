# Required CI/CD variables (Settings > CI/CD > Variables), not declared here since they're secrets:
#   VCS_TOKEN — a bot personal access token with the "api" scope. CI_JOB_TOKEN is not enough:
#               it cannot merge a merge request or post/edit notes on one.
#
# flex-cleanup needs a CI/CD schedule (Build > Pipeline schedules) targeting the default branch —
# GitLab has no pipeline trigger equivalent to GitHub's "pull_request_target: types: [closed]",
# so orphaned flex/mr-* branches are swept periodically instead of removed the instant a merge
# request closes.
#
# Project-level settings this pipeline depends on, none of which live in this file (GitLab doesn't
# version them as YAML) — set them once per project under Settings:
#   Settings > Merge requests:
#     - "Pipelines must succeed" (only_allow_merge_if_pipeline_succeeds) — without this, GitLab
#       still shows a merge request as mergeable even when run-checks/create-project failed; the
#       merge_when_pipeline_succeeds call below only prevents the *bot* from auto-merging a red
#       pipeline, not a human clicking "Merge" by hand.
#     - "All threads must be resolved" (only_allow_merge_if_all_discussions_are_resolved) —
#       standard open-source hygiene: review comments can't be silently ignored.
#     - Merge method: squash — keeps main's history to one commit per recipe/fix regardless of how
#       many WIP commits a contributor pushed to their branch.
#   Settings > Repository > Protected branches:
#     - main: "Allowed to push" and "Allowed to merge" set to Maintainers (or stricter), "Allow
#       force push" off. This is what actually stops someone from bypassing run-checks entirely by
#       pushing straight to main — the CI/CD variables above only govern merge requests.

stages:
    - qa
    - create-project
    - flex-update
    - flex-update-archived
    - flex-cleanup

variables:
    # Pin this to a tagged release once you've picked one — see this fork's README, "why it is
    # not expected to be upstreamed", reason #1: pulling an unversioned branch on every CI run is
    # the exact risk that section warns about.
    CHECKER_REF: main
    # SPDX identifier your recipes must declare in the MR description (e.g. "MIT"). Leave empty
    # to skip the license check entirely — lint:pull-request treats --license as optional.
    REQUIRED_LICENSE: ""
    # The Code Quality *widget* (inline diff annotations + MR summary panel) is a GitLab Ultimate
    # feature. Set this to "true" only if you know this instance has that widget available (e.g.
    # a self-hosted GitLab with an Ultimate license) — run-checks will then skip posting the
    # sticky MR note that otherwise stands in for it on Free/Premium.
    CODEQUALITY_WIDGET_AVAILABLE: "false"

run-checks:
    stage: qa
    image: composer:2
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    before_script:
        - apk add --no-cache git curl jq python3
        - install-php-extensions intl
        - git clone --branch "$CHECKER_REF" --depth 1 https://github.com/madcat34/private-recipes-checker.git .checker
        - (cd .checker && composer install --no-dev --ansi)
    script:
        - |
            # Run every lint command to completion instead of stopping at the first failure, so a
            # single pipeline run surfaces every issue across every category at once (each command
            # still writes its own gl-code-quality-report-<command>.json regardless of its exit
            # code). The job itself still fails overall if any of them did.
            LINT_FAILED=0
            .checker/run lint:manifests || LINT_FAILED=1
            .checker/run lint:files || LINT_FAILED=1
            find * -name '*.yaml' | .checker/run lint:yaml || LINT_FAILED=1
            .checker/run lint:packages || LINT_FAILED=1
            if [ -n "$REQUIRED_LICENSE" ]; then
                .checker/run lint:pull-request --license="$REQUIRED_LICENSE" || LINT_FAILED=1
            else
                .checker/run lint:pull-request || LINT_FAILED=1
            fi
            if [ "$LINT_FAILED" -eq 1 ]; then
                exit 1
            fi
        - .checker/run list-unpatched-packages | xargs -r -n10 rm -rf
        - |
            if [ "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" = "$CI_DEFAULT_BRANCH" ]; then
                mkdir flex-endpoint
                git ls-tree HEAD */*/* | php .checker/run generate:flex-endpoint "$CI_PROJECT_PATH" "$CI_DEFAULT_BRANCH" "flex/mr-$CI_MERGE_REQUEST_IID" flex-endpoint
                git config --global user.email ""
                git config --global user.name "gitlab-ci"
                git stash
                git switch --orphan "flex/mr-$CI_MERGE_REQUEST_IID"
                git reset --hard -q
                FLEX_FILES=$(ls flex-endpoint/*.json | xargs -n1 basename)
                mv flex-endpoint/*.json .
                git add -- $FLEX_FILES
                git commit -m 'Create Flex endpoint' || true
                git push -f "https://gitlab-ci-token:${VCS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "flex/mr-$CI_MERGE_REQUEST_IID"
                git checkout "$CI_COMMIT_SHA"
                git stash pop -q || true
                # flex-endpoint/ is untracked (its *.json were mv'd out above, but archived/ isn't),
                # so the git checkout above doesn't remove it — left alone it shows up as a bogus
                # top-level "package" to the diff-recipe-versions find below.
                rm -rf flex-endpoint
            fi
        - >
            curl --silent --request PUT --header "PRIVATE-TOKEN: ${VCS_TOKEN}"
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/merge?merge_when_pipeline_succeeds=true&squash=true"
            || true
        - |
            # diff-recipe-versions expects one "vendor/package" path per line (it scandir()s each
            # one for version subdirectories) — a plain top-level `find -maxdepth 1` only lists
            # "vendor", one level too shallow, which silently produced garbage package names
            # ("./monolog:^..") in the "how to test" composer req snippet below.
            find * -mindepth 1 -maxdepth 1 -type d | sort \
                | .checker/run diff-recipe-versions "${CI_SERVER_URL}/${CI_PROJECT_PATH}/-/raw/flex/mr-${CI_MERGE_REQUEST_IID}/index.json" \
                > diff-recipe-versions.md
        - |
            # "Sticky" comment: update the existing note if one was already posted on this MR,
            # instead of piling up a new one on every pipeline run (marocchino/sticky-pull-request
            # -comment's behavior on the GitHub side).
            MARKER='<!-- recipes-checker:diff-recipe-versions -->'
            { echo "$MARKER"; cat diff-recipe-versions.md; } > note-body.md
            NOTE_ID=$(curl --silent --header "PRIVATE-TOKEN: ${VCS_TOKEN}" \
                "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes?per_page=100" \
                | jq -r --arg marker "$MARKER" '[.[] | select(.body | startswith($marker))][0].id // empty')
            if [ -n "$NOTE_ID" ]; then
                curl --silent --request PUT --header "PRIVATE-TOKEN: ${VCS_TOKEN}" \
                    --data-urlencode "body@note-body.md" \
                    "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes/${NOTE_ID}"
            else
                curl --silent --request POST --header "PRIVATE-TOKEN: ${VCS_TOKEN}" \
                    --data-urlencode "body@note-body.md" \
                    "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"
            fi
    after_script:
        - |
            # runs even when `script` failed partway through (e.g. a lint command exited non-zero
            # and skipped the rest of the job). GitLab's codequality report uploader rejects more
            # than one matching file ("only one file can be sent as raw"), so merge each lint
            # command's own gl-code-quality-report-*.json into a single array here, before the
            # artifacts:reports:codequality upload runs. jq was already installed by before_script.
            jq -s 'add' gl-code-quality-report-*.json > gl-code-quality-report.json 2>/dev/null || echo '[]' > gl-code-quality-report.json
        - |
            # The Code Quality *widget* (inline diff annotations + MR summary panel) is a GitLab
            # Ultimate feature — on Free/Premium the report above still uploads as a plain job
            # artifact, but nothing surfaces it on the MR itself. Post it as a sticky MR note
            # instead, same pattern as the diff-recipe-versions note below, unless this instance
            # is known to have the widget (CODEQUALITY_WIDGET_AVAILABLE), where the note would
            # just duplicate it.
            if [ "$CODEQUALITY_WIDGET_AVAILABLE" != "true" ]; then
                MARKER='<!-- recipes-checker:codequality -->'
                ISSUE_COUNT=$(jq 'length' gl-code-quality-report.json)
                if [ "$ISSUE_COUNT" -gt 0 ]; then
                    {
                        echo "$MARKER"
                        echo "### Code Quality: $ISSUE_COUNT issue(s)"
                        jq -r '.[] | "- **\(.location.path):\(.location.lines.begin)** — \(.description)"' gl-code-quality-report.json
                    } > codequality-note-body.md
                else
                    { echo "$MARKER"; echo "### Code Quality: no issues"; } > codequality-note-body.md
                fi
                NOTE_ID=$(curl --silent --header "PRIVATE-TOKEN: ${VCS_TOKEN}" \
                    "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes?per_page=100" \
                    | jq -r --arg marker "$MARKER" '[.[] | select(.body | startswith($marker))][0].id // empty')
                if [ -n "$NOTE_ID" ]; then
                    curl --silent --request PUT --header "PRIVATE-TOKEN: ${VCS_TOKEN}" \
                        --data-urlencode "body@codequality-note-body.md" \
                        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes/${NOTE_ID}"
                else
                    curl --silent --request POST --header "PRIVATE-TOKEN: ${VCS_TOKEN}" \
                        --data-urlencode "body@codequality-note-body.md" \
                        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"
                fi
            fi
    artifacts:
        when: always
        reports:
            codequality: gl-code-quality-report.json

# This job fetches the flex/mr-* endpoint via GitLab's -/raw/ web route, unauthenticated. That
# route rejects PRIVATE-TOKEN, Basic auth, and private_token alike on a private project (confirmed
# against a real one — all three redirect to /users/sign_in), so this job only works if the
# recipes repository (or at least its flex/mr-* branches) is public. It also can't be swapped for
# the API's repository/files/.../raw endpoint: Composer/Flex resolves each per-package recipe file
# by textually swapping "index.json" for "{package}.json" in SYMFONY_ENDPOINT, assuming sibling
# files under the same "directory" — which holds for -/raw/<branch>/index.json but not for the
# API's path-segment-based URL shape.
create-project:
    stage: create-project
    image: php:8.4-cli
    needs: ["run-checks"]
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    before_script:
        - apt-get update -qq && apt-get install -qq -y unzip
        - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
        - >
            PACKAGES=$(curl -sS --header "PRIVATE-TOKEN: ${VCS_TOKEN}"
            "${CI_SERVER_URL}/${CI_PROJECT_PATH}/-/raw/flex/mr-${CI_MERGE_REQUEST_IID}/index.json"
            | php -r '$d=json_decode(file_get_contents("php://stdin"),true);$p=[];foreach($d["recipes"] as $k=>$v){$p[]="$k:^".end($v);}echo implode(" ",$p);')
    script:
        - composer create-project --ansi symfony/skeleton test-project
        - cd test-project
        - composer config extra.symfony.allow-contrib false
        - composer config minimum-stability dev
        - export SYMFONY_ENDPOINT="${CI_SERVER_URL}/${CI_PROJECT_PATH}/-/raw/flex/mr-${CI_MERGE_REQUEST_IID}/index.json"
        - composer require -W --ansi $PACKAGES

flex-update:
    stage: flex-update
    image: composer:2
    rules:
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    before_script:
        - apk add --no-cache git
        - install-php-extensions intl
        - git clone --branch "$CHECKER_REF" --depth 1 https://github.com/madcat34/private-recipes-checker.git .checker
        - (cd .checker && composer install --no-dev --ansi)
        - git config --global user.email ""
        - git config --global user.name "gitlab-ci"
    script:
        - |
            mkdir flex-endpoint
            git ls-tree HEAD */*/* | php .checker/run generate:flex-endpoint "$CI_PROJECT_PATH" "$CI_DEFAULT_BRANCH" flex/main flex-endpoint
            if git fetch origin flex/main; then
                git switch flex/main
                git rm -q *.json
            else
                git switch --orphan flex/main
            fi
            mv flex-endpoint/*.json .
            git add ./*.json
            cp -a flex-endpoint/archived .
            git add archived/
            php .checker/run generate:recipes-readme index.json > RECIPES.md
            git add RECIPES.md
            git commit -m 'Update Flex endpoint' || true
            git push -f "https://gitlab-ci-token:${VCS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" flex/main

flex-update-archived:
    stage: flex-update-archived
    image: composer:2
    rules:
        -
            if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
            when: manual
    allow_failure: true
    before_script:
        - apk add --no-cache git
        - install-php-extensions intl
        - git clone --branch "$CHECKER_REF" --depth 1 https://github.com/madcat34/private-recipes-checker.git .checker
        - (cd .checker && composer install --no-dev --ansi)
        - git config --global user.email ""
        - git config --global user.name "gitlab-ci"
    script:
        - |
            git checkout "$CI_DEFAULT_BRANCH"
            # Generated outside the working tree switch below picks up: flex/main already has its
            # own tracked archived/ (from a previous run), and git switch refuses to change branch
            # over untracked files it would otherwise overwrite.
            mkdir /tmp/archived-endpoint
            php .checker/run generate:archived-recipes . "$CI_DEFAULT_BRANCH" /tmp/archived-endpoint "$CI_PROJECT_PATH"
            git fetch origin flex/main
            git switch flex/main
            rm -rf archived
            cp -a /tmp/archived-endpoint archived
            git add archived/
            git commit -m 'Update Flex archives' || true
            git push -f "https://gitlab-ci-token:${VCS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" flex/main

flex-cleanup:
    stage: flex-cleanup
    image: alpine:latest
    rules:
        - if: $CI_PIPELINE_SOURCE == "schedule"
    before_script:
        - apk add --no-cache git curl jq
    script:
        - |
            OPEN_IIDS=$(curl --silent --header "PRIVATE-TOKEN: ${VCS_TOKEN}" \
                "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests?state=opened&per_page=100" \
                | jq -r '.[].iid')
            git ls-remote "https://gitlab-ci-token:${VCS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" 'refs/heads/flex/mr-*' \
                | sed 's#.*refs/heads/##' \
                | while read -r branch; do
                    iid="${branch#flex/mr-}"
                    if ! grep -qx "$iid" <<< "$OPEN_IIDS"; then
                        git push "https://gitlab-ci-token:${VCS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" --delete "$branch" || true
                    fi
                done
