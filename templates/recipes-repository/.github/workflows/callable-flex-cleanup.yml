name: Cleanup Flex testing endpoint

on:
    workflow_call:
        secrets:
            token:
                required: true

jobs:
    flex-cleanup:
        name: Cleanup Flex testing endpoint
        runs-on: ubuntu-latest

        steps:
            -
                name: Checkout
                uses: actions/checkout@v4

            -
                name: Cleanup Flex testing endpoint
                run: |
                    git config --local --unset-all http.https://github.com/.extraheader || true
                    git push "https://x-access-token:${{ secrets.token }}@github.com/${{ github.repository }}" --delete "flex/pull-${{ github.event.number }}" || true
