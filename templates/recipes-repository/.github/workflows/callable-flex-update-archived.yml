name: Update Flex Archives

on:
    workflow_call:
        inputs:
            branch:
                default: main
                required: false
                type: string
            checker_ref:
                description: 'madcat34/private-recipes-checker git ref to use — pin to a tagged release once you have picked one'
                default: main
                required: false
                type: string
        secrets:
            token:
                required: true

jobs:
    flex-update-archived:
        name: Update Flex Archives
        runs-on: ubuntu-latest

        steps:
            -
                name: Checkout
                uses: actions/checkout@v4
                id: checkout
                with:
                    fetch-depth: 0

            -
                name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    coverage: "none"
                    php-version: "8.4"

            -
                name: Install tools
                run: |
                    git config --global user.email ""
                    git config --global user.name "github-action[bot]"
                    cd .github
                    rm -rf recipes-checker.zip recipes-checker-main
                    wget -q -O recipes-checker.zip "https://codeload.github.com/madcat34/private-recipes-checker/zip/refs/heads/${{ inputs.checker_ref }}"
                    unzip -q recipes-checker.zip
                    mv private-recipes-checker-* recipes-checker-main
                    cd recipes-checker-main
                    composer install --ansi --no-dev

            -
                name: Update Flex Archives
                run: |
                    git switch ${{ inputs.branch }}

                    mkdir .github/archived
                    php .github/recipes-checker-main/run generate:archived-recipes . ${{ inputs.branch }} .github/archived ${{ github.repository }}

                    git switch flex/main
                    rm -rf archived
                    cp -a .github/archived .
                    git add archived/
                    git commit -m 'Update Flex archives' || true
                    git config --local --unset-all http.https://github.com/.extraheader || true
                    git push -f "https://x-access-token:${{ secrets.token }}@github.com/${{ github.repository }}" flex/main
