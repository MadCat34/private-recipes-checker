name: Update Flex endpoint

on:
    workflow_call:
        inputs:
            branch:
                default: main
                required: false
                type: string
            checker_ref:
                description: 'madcat34/private-recipes-checker git ref to use — pin to a tagged release once you have picked one'
                default: main
                required: false
                type: string
        secrets:
            token:
                required: true

jobs:
    flex-update:
        name: Update Flex endpoint
        runs-on: ubuntu-latest

        steps:
            -
                name: Checkout
                uses: actions/checkout@v4
                id: checkout
                with:
                    fetch-depth: 0

            -
                name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    coverage: "none"
                    php-version: "8.4"

            -
                name: Install tools
                run: |
                    git config --global user.email ""
                    git config --global user.name "github-action[bot]"
                    cd .github
                    rm -rf recipes-checker.zip recipes-checker-main
                    wget -q -O recipes-checker.zip "https://codeload.github.com/madcat34/private-recipes-checker/zip/refs/heads/${{ inputs.checker_ref }}"
                    unzip -q recipes-checker.zip
                    mv private-recipes-checker-* recipes-checker-main
                    cd recipes-checker-main
                    composer install --ansi --no-dev

            -
                name: Update Flex endpoint
                run: |
                    mkdir .github/flex-endpoint
                    git ls-tree HEAD */*/* | php .github/recipes-checker-main/run generate:flex-endpoint ${{ github.repository }} ${{ inputs.branch }} flex/main .github/flex-endpoint
                    if git fetch origin flex/main; then
                        git switch flex/main
                        git rm -q *.json
                    else
                        git switch --orphan flex/main
                    fi
                    mv .github/flex-endpoint/*.json .
                    git add *.json
                    cp -a .github/flex-endpoint/archived .
                    git add archived/
                    php .github/recipes-checker-main/run generate:recipes-readme index.json > RECIPES.md
                    git add RECIPES.md
                    git commit -m 'Update Flex endpoint' || true
                    git config --local --unset-all http.https://github.com/.extraheader || true
                    git push -f "https://x-access-token:${{ secrets.token }}@github.com/${{ github.repository }}" "flex/main"
