# Update Flex endpoint — mirrors .github/workflows/flex-update.yml + callable-flex-update.yml.
#
# Runs on every push to the default branch: rebuilds flex/main from the recipes currently on
# main, plus RECIPES.md.

flex-update:
    stage: flex-update
    image: composer:2
    rules:
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    before_script:
        - apk add --no-cache git
        - install-php-extensions intl
        - git clone --branch "$CHECKER_REF" --depth 1 https://github.com/madcat34/private-recipes-checker.git .checker
        - (cd .checker && composer install --no-dev --ansi)
        - git config --global user.email ""
        - git config --global user.name "gitlab-ci"
    script:
        - |
            mkdir flex-endpoint
            git ls-tree HEAD */*/* | php .checker/run generate:flex-endpoint "$CI_PROJECT_PATH" "$CI_DEFAULT_BRANCH" flex/main flex-endpoint
            if git fetch origin flex/main; then
                git switch flex/main
                git rm -q *.json
            else
                git switch --orphan flex/main
            fi
            mv flex-endpoint/*.json .
            git add ./*.json
            cp -a flex-endpoint/archived .
            git add archived/
            php .checker/run generate:recipes-readme index.json > RECIPES.md
            git add RECIPES.md
            git commit -m 'Update Flex endpoint' || true
            git push -f "https://gitlab-ci-token:${VCS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" flex/main
